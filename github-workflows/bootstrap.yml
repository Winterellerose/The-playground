name: Bootstrap workflows
on: {push: {branches: [master], paths: ['github-workflows/**']}}
jobs:
  move:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Move workflows into .github/workflows
        run: |
          mkdir -p .github/workflows
          mv github-workflows/ci.yml .github/workflows/ci.yml
          mv github-workflows/pages.yml .github/workflows/pages.yml
          git config user.name "playground-bootstrap"
          git config user.email "playground-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Move workflows into .github/workflows" || echo "nothing to commit"
          git push
      - name: Remove bootstrap workflow
        run: |
          git rm -q github-workflows/bootstrap.yml || true
          git commit -m "Remove bootstrap workflow (one-time)" || echo "nothing to commit"
          git push
