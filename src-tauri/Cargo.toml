[package]
name = "the-playground"
version = "3.0.0"
description = "Multi-provider AI studio — single-file artifact, no server deps"
authors = ["Winterellerose"]
edition = "2021"
repository = "https://github.com/Winterellerose/The-playground"
default-run = "the-playground"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
