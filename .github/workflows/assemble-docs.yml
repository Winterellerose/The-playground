name: Assemble docs bundle
on:
  push:
    paths:
      - 'docs/_restore/**'
      - '.github/workflows/assemble-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzipped base64 parts into docs/index.html
        run: |
          set -euo pipefail
          cat docs/_restore/p*.b64 | base64 -d | gzip -dc > docs/index.html
          wc -c docs/index.html
          grep -q "Atria Dawn" docs/index.html
          grep -q "keyAtria" docs/index.html
          grep -q "api.atria-asi.ai" docs/index.html
          grep -q "atria:" docs/index.html
      - name: Commit rebuilt docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild docs with Atria Dawn provider"
            git push
          fi
