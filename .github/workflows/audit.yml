name: Model Catalog Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create PR with updated models'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run model audit
        id: audit
        run: |
          set +e
          npm run audit:models 2>&1 | tee audit.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "status=clean" >> $GITHUB_OUTPUT
            echo "✅ Catalog is up to date"
          elif [ $exit_code -eq 1 ]; then
            echo "status=drift" >> $GITHUB_OUTPUT
            echo "⚠️ Catalog drift detected"
            cat audit.log
          else
            echo "Catalog audit could not complete"
            exit "$exit_code"
          fi

      - name: Fetch and generate updated catalog
        if: steps.audit.outputs.status == 'drift' && github.event.inputs.create_pr == 'true'
        run: |
          curl --fail --show-error --max-time 30 https://openrouter.ai/api/v1/models -o /tmp/catalog.json
          node scripts/update-models.js /tmp/catalog.json

      - name: Run tests to verify
        if: steps.audit.outputs.status == 'drift' && github.event.inputs.create_pr == 'true'
        run: npm test && npm run build

      - name: Create Pull Request
        if: steps.audit.outputs.status == 'drift' && github.event.inputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update OpenRouter free model catalog [auto]'
          title: 'chore: update OpenRouter free model catalog [auto]'
          body: |
            Automated update from the weekly model audit.

            **Changes:**
            - Refreshed OpenRouter free model list from live catalog
            - Removed retired/unavailable models
            - Added newly available free models

            Run `npm test` locally to verify.
          branch: auto/model-catalog-update
          delete-branch: true
          labels: 'automated,models'

      - name: Comment on drift (no PR)
        if: steps.audit.outputs.status == 'drift' && github.event.inputs.create_pr != 'true'
        run: |
          echo "::warning::Model catalog drift detected. Run workflow with 'create_pr=true' to auto-fix."
          cat audit.log