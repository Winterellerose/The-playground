name: Model catalog audit

on:
  schedule:
    # Weekly, Mondays 09:00 UTC — free-provider catalogs churn, so drift is
    # checked on a cadence rather than on every push.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Compares the curated OpenRouter model IDs in js/config.js against the
      # live OpenRouter catalog. Fails on drift; warns (not fails) on network
      # errors — that behavior lives in tests/audit-models.js itself.
      - run: npm run audit:models
